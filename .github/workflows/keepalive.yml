name: Supabase keep-alive

# Free-tier Supabase pauses projects after ~1 week without activity — which
# would kill a client demo. This pings a DB-backed edge function daily so the
# project stays ACTIVE_HEALTHY. (Found INACTIVE on 2026-06-11; restored.)
#
# GitHub disables scheduled workflows after 60 days without repository
# activity, which silently stopped this ping from 2026-09-27. The last step
# re-enables the workflow through the API on every run so a quiet repo
# doesn't switch it off.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping config endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://kkjjbjrebeoekindsihw.supabase.co/functions/v1/config?tenantId=dev-tenant" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "config endpoint returned $code"
          test "$code" = "200"
      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
